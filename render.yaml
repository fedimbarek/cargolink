# Blueprint Render : https://render.com/docs/blueprint-spec  (New > Blueprint > choisir le dépôt GitHub)
databases:
  - name: cargolink-db
    plan: free
    databaseName: cargolink
    user: cargolink

services:
  - type: web
    name: cargolink
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn_worker.UvicornWorker"
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: cargolink-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@cargolink.tn
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false            # à saisir dans le dashboard Render (jamais dans Git)
      # Facultatif: file de tâches pour l'IA. Créez un « Key Value » Render et collez son URL ici,
      # puis ajoutez un Background Worker: celery -A config worker -l info
      # - key: REDIS_URL
      #   sync: false
