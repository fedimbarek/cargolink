{# Champ de formulaire accessible : label lié, astérisque annoncé, erreurs reliées par aria-describedby #}
<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}
  <span class="text-danger" aria-hidden="true">*</span><span class="visually-hidden">(obligatoire)</span>{% endif %}</label>
{{ field }}
{% if field.help_text %}<div id="{{ field.auto_id }}_helptext" class="form-text">{{ field.help_text }}</div>{% endif %}
{% if field.errors %}<div id="{{ field.auto_id }}_error" class="text-danger small" role="alert">{% for e in field.errors %}{{ e }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>{% endif %}
