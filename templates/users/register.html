{% extends "base.html" %}
{% block title %}Inscription - CargoLink{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Créer un compte</h4>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100">S'inscrire</button>
        </form>
        <p class="mt-3 mb-0 small">Déjà inscrit ? <a href="{% url 'login_page' %}">Se connecter</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
