{% extends "base.html" %}
{% block title %}Notifications - CargoLink{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Notifications</h3>
  <form method="post" action="{% url 'reservations:notifications_tout_lire' %}">{% csrf_token %}
    <button class="btn btn-sm btn-outline-secondary">Tout marquer comme lu</button>
  </form>
</div>
<div class="list-group">
  {% for n in notifications %}
    <div class="list-group-item p-0 d-flex align-items-stretch">
      <form method="post" action="{% url 'reservations:notification_ouvrir' n.pk %}" class="m-0 flex-grow-1">
        {% csrf_token %}
        <button class="btn btn-link text-start text-decoration-none text-reset w-100 h-100 d-flex justify-content-between align-items-center {% if not n.lue %}fw-bold{% endif %}">
          <span>
            {{ n.message }}
            {% if n.transporteur_id %}<span class="badge bg-secondary ms-2">Transporteur #{{ n.transporteur_id }}</span>{% endif %}
          </span>
          <span class="small text-muted ms-3 text-nowrap">{{ n.created_at|date:"d/m H:i" }}</span>
        </button>
      </form>
      <form method="post" action="{% url 'reservations:notification_supprimer' n.pk %}" class="m-0 d-flex align-items-center p-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
      </form>
    </div>
  {% empty %}
    <div class="alert alert-info">Aucune notification.</div>
  {% endfor %}
</div>
{% endblock %}
