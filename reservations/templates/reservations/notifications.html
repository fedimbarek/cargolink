{% extends "base.html" %}
{% block title %}Notifications - CargoLink{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Notifications</h3>
  <form method="post" action="{% url 'reservations:notifications_tout_lire' %}">{% csrf_token %}
    <button class="btn btn-sm btn-outline-secondary">Tout marquer comme lu</button>
  </form>
</div>
<div class="list-group">
  {% for n in notifications %}
    <form method="post" action="{% url 'reservations:notification_ouvrir' n.pk %}" class="m-0">{% csrf_token %}
      <button class="list-group-item list-group-item-action d-flex justify-content-between {% if not n.lue %}fw-bold{% endif %}">
        <span>
          {{ n.message }}
          {% if n.transporteur_id %}<span class="badge bg-secondary ms-2">Transporteur #{{ n.transporteur_id }}</span>{% endif %}
        </span>
        <span class="small text-muted ms-3 text-nowrap">{{ n.created_at|date:"d/m H:i" }}</span>
      </button>
    </form>
  {% empty %}
    <div class="alert alert-info">Aucune notification.</div>
  {% endfor %}
</div>
{% endblock %}
