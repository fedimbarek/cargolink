{% extends "base.html" %}
{% block title %}Notifications - CargoLink{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Notifications</h1>
  <form method="post" action="{% url 'reservations:notifications_tout_lire' %}">{% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-secondary">Tout marquer comme lu</button>
  </form>
</div>
<ul class="list-group" aria-label="Liste des notifications">
  {% for n in notifications %}
    <li class="list-group-item p-0 d-flex align-items-stretch">
      <form method="post" action="{% url 'reservations:notification_ouvrir' n.pk %}" class="m-0 flex-grow-1">
        {% csrf_token %}
        <button type="submit" aria-label="Ouvrir et marquer comme lue : {{ n.message }}"
                class="btn btn-link text-start text-decoration-none text-reset w-100 h-100 d-flex justify-content-between align-items-center {% if not n.lue %}fw-bold{% endif %}">
          <span>
            <span class="visually-hidden">{% if n.lue %}Lue : {% else %}Non lue : {% endif %}</span>
            {{ n.message }}
            {% if n.transporteur_id %}<span class="badge bg-secondary ms-2">Transporteur #{{ n.transporteur_id }}</span>{% endif %}
          </span>
          <time class="small text-muted ms-3 text-nowrap" datetime="{{ n.created_at|date:'c' }}">{{ n.created_at|date:"d/m H:i" }}</time>
        </button>
      </form>
      <form method="post" action="{% url 'reservations:notification_supprimer' n.pk %}" class="m-0 d-flex align-items-center p-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
      </form>
    </li>
  {% empty %}
    <li class="list-group-item alert alert-info mb-0">Aucune notification.</li>
  {% endfor %}
</ul>
{% endblock %}
