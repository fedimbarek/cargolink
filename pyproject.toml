[project]
name = "cargolink"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "requests>=2.34.2",
    "python-dotenv>=1.2",
    # IA / machine learning
    "scikit-learn>=1.9.1",
    "numpy>=2.4",
    "joblib>=1.6.0",
    "celery>=5.6",
    "redis>=5",
    # déploiement
    "gunicorn>=26",
    "uvicorn>=0.54",
    "uvicorn-worker>=0.4",
    "whitenoise[brotli]>=6.12",
    "dj-database-url>=3.1",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "coverage>=7.16",
    "matplotlib>=3.9",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]